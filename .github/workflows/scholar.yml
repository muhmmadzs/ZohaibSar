name: Refresh Scholar stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scholar often blocks datacenter IPs; on failure keep the last good data.
      - name: Fetch stats
        id: fetch
        continue-on-error: true
        run: python3 scripts/scholar_stats.py

      - name: Commit if changed
        id: commit
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- assets/scholar.json; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "scholar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/scholar.json
            git commit -m "chore: refresh Scholar stats"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so redeploy Pages explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main --repo "$GITHUB_REPOSITORY"
