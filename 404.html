<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Muhammad Zohaib Sarwar</title>
    <meta name="robots" content="noindex">
    <style>
      /* Self-contained: GitHub Pages serves 404.html at any URL depth,
         so relative asset paths cannot be relied on here. */
      :root {
        --paper: #F6FAF9; --ink: #182226; --muted: #54666B; --teal: #0F766E;
      }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #0B1517; --ink: #EAF2F1; --muted: #9DB4B6; --teal: #4FD1C5; }
      }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--paper); color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px;
      }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 64px; font-weight: 700; color: var(--teal); margin: 0; }
      h1 { font-size: 24px; margin: 8px 0 12px; }
      p { color: var(--muted); margin: 0 0 24px; }
      a.btn {
        display: inline-block; padding: 12px 22px; border-radius: 12px;
        background: var(--teal); color: var(--paper); text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="btn" href="https://muhmmadzs.github.io/ZohaibSar/">Back to the homepage</a>
    </main>
  </body>
</html>
